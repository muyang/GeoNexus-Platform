# ============================================================================
# GeoNexus 站点（nginx 是唯一入口）
#
#   静态前端  → /opt/geonexus/platform/frontend/dist（Vue3 构建产物，SPA）
#   身份权限  → Java / RuoYi 管理面 127.0.0.1:8080
#   业务治理  → Node BFF 127.0.0.1:3301（案例/审批/配额/九大模块/SDK 与 GeoKG 代理）
#
# 为什么这样分流：身份权威在 Java，业务与治理在 Node BFF。分流规则与本地开发
# （frontend/vite.config.js 的 proxy）保持一致，前端无需区分环境。
#
# 安装：cp deploy/nginx/geonexus.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# ============================================================================

upstream geonexus_bff      { server 127.0.0.1:3301; keepalive 16; }
upstream geonexus_identity { server 127.0.0.1:8080; keepalive 16; }

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /opt/geonexus/platform/frontend/dist;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # 地理数据上传可能很大（栅格/矢量包）
    client_max_body_size 512m;
    client_body_timeout  300s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml application/wasm;

    # ---- 安全响应头 --------------------------------------------------------
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # CSP：MapLibre 与 Cesium 都需要 worker-src/child-src blob:（Cesium 的 Web Worker 走 blob）；
    # 底图瓦片与字体来自 CDN，必须显式放行。
    # 若换用天地图/其他瓦片源，把域名加进 img-src 与 connect-src。
    add_header Content-Security-Policy "\
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com; \
connect-src 'self' https://*.basemaps.cartocdn.com https://tiles.openfreemap.org https://server.arcgisonline.com; \
worker-src 'self' blob:; \
child-src 'self' blob:; \
font-src 'self' data:; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self'" always;

    # ---- 身份与权限 → Java（RuoYi）----------------------------------------
    location ~ ^/(api/(auth|system)|\.well-known)/ {
        proxy_pass         http://geonexus_identity;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # ---- 业务与治理 → Node BFF --------------------------------------------
    location /api/ {
        proxy_pass         http://geonexus_bff;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # 案例复跑要轮询 SDK 任务，治理面某些调用偏慢
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;      # 便于将来接 SSE（任务进度流）
    }

    # ---- 上传文件 ---------------------------------------------------------
    location /uploads/ {
        proxy_pass         http://geonexus_bff;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }

    # ---- 前端静态资源 -----------------------------------------------------
    # 带 hash 的产物可长缓存；index.html 绝不缓存，避免发版后拿到旧壳
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 回落：前端路由自行处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（给负载均衡/监控用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

