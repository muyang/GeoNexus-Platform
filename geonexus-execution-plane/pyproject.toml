[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geonexus-execution-plane"
version = "1.0.0"
description = "GeoNexus Execution Plane — 统一入口：GeoMCP + Registry + GeoAgent + OGE"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "geonexus-sdk[mcp]>=1.0.0",
    "uvicorn>=0.27",
]

[project.scripts]
geonexus-execution-plane = "geonexus_execution_plane.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# ── Lint 规则与 SDK 保持一致 ──
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"